<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF翻译器 Pro Max版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.container { max-width: 500px; margin: 0 auto; }
h1 { color: #00d4ff; text-align: center; margin-bottom: 15px; font-size: 18px; }
.api-status { text-align: center; font-size: 11px; color: #888; margin-bottom: 15px; }
.api-status span { color: #00ff88; }
label { color: #aaa; font-size: 13px; display: block; margin-bottom: 6px; }
textarea {
  width: 100%; background: #0f0f1a; border: 2px solid #4a4a6a; border-radius: 10px;
  padding: 12px; color: #fff; font-size: 15px; resize: none; margin-bottom: 12px;
}
#inputText { height: 80px; }
#bfOutput { height: 100px; color: #00ff88; }
.detailBox {
  background: #1a1a2e; border: 2px solid #3a3a5a; border-radius: 10px;
  padding: 12px; color: #aaa; font-size: 13px; margin-bottom: 12px;
  line-height: 2; max-height: 150px; overflow-y: auto;
}
.char-item { display: inline-block; margin-right: 10px; padding: 2px 6px; background: #2a2a4a; border-radius: 4px; }
.char-item .py { color: #00d4ff; }
.char-item .bf { color: #00ff88; }
.buttons { display: flex; gap: 8px; }
button {
  flex: 1; border: none; color: #000; padding: 12px;
  border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
}
button:active { transform: scale(0.95); }
#translateBtn { background: linear-gradient(145deg, #00d4ff, #0099cc); }
#copyBtn { background: linear-gradient(145deg, #00ff88, #00cc6a); }
#clearBtn { background: linear-gradient(145deg, #ff6b6b, #cc4444); color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>🎤 BF翻译器 Pro Max版</h1>
  <p class="api-status">离线版 · <span>无需网络</span> · 零跨域问题</p>
  
  <label>输入中文：</label>
  <textarea id="inputText" placeholder="牛逼克拉斯"></textarea>
  
  <label>逐字详情（拼音 → BF音节）：</label>
  <div class="detailBox" id="detailBox">点击翻译后显示详情...</div>
  
  <label>BF语言输出：</label>
  <textarea id="bfOutput" readonly></textarea>
  
  <div class="buttons">
    <button id="translateBtn" onclick="translate()">🔄 翻译</button>
    <button id="copyBtn" onclick="copyText()">📋 复制</button>
    <button id="clearBtn" onclick="clearAll()">清空</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.22.3/dist/index.min.js"></script>
<script>
// ===== 咕咕嘎规则表（自由改）=====
const bfMap = {
  'b': 'beep', 'p': 'bap', 'm': 'boop', 'f': 'bep',
  'd': 'skdoo', 't': 'ta', 'n': 'nu', 'l': 'la',
  'g': 'gu', 'k': 'gak', 'h': 'haa',
  'j': 'jit', 'q': 'que', 'x': 'shi',
  'zh': 'zhee', 'ch': 'chee', 'sh': 'shee', 'r': 'rrr',
  'z': 'zap', 'c': 'cee', 's': 'sss',
  'y': 'yep', 'w': 'woo'
};

function pinyinToBF(py) {
  // 去声调
  py = py.replace(/[āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ]/g, m => {
    const map = {ā:'a',á:'a',ǎ:'a',à:'a',ō:'o',ó:'o',ǒ:'o',ò:'o',ē:'e',é:'e',ě:'e',è:'e',ī:'i',í:'i',ǐ:'i',ì:'i',ū:'u',ú:'u',ǔ:'u',ù:'u',ǖ:'ü',ǘ:'ü',ǚ:'ü',ǜ:'u'};
    return map[m] || m;
  });
  // 取声母
  const match = py.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])/);
  const initial = match ? match[1] : '';
  return bfMap[initial] || 'mm';
}

function translate() {
  const text = document.getElementById('inputText').value.trim();
  const detailBox = document.getElementById('detailBox');
  const outputBox = document.getElementById('bfOutput');
  if (!text) {
    outputBox.value = '⚠️ 输入中文再点翻译～';
    return;
  }
  
  const bfParts = [];
  const detailParts = [];
  
  for (const char of text) {
    if (/[\u4e00-\u9fff]/.test(char)) {
      const { pinyin } = window.pinyinPro || window.PinyinPro;
      const pyArr = pinyin(char, { type: 'array', toneType: 'none' });
      const py = pyArr[0] || char;
      const bf = pinyinToBF(py);
      bfParts.push(bf);
      detailParts.push(`<span class="char-item"><span class="py">${char}(${py})</span> → <span class="bf">${bf}</span></span>`);
    } else if (/[a-zA-Z]/.test(char)) {
      bfParts.push(char);
      detailParts.push(`<span class="char-item">${char}</span>`);
    } else if (/[,.!?.:]/.test(char)) {
      bfParts.push(char);
      detailParts.push(`<span class="char-item">${char}</span>`);
    }
  }
  
  detailBox.innerHTML = detailParts.join('');
  outputBox.value = bfParts.join(' , ');
}

function copyText() {
  const text = document.getElementById('bfOutput').value;
  if (!text || text.includes('⚠️') || text.includes('🔄')) {
    alert('没有什么可复制的～');
    return;
  }
  navigator.clipboard.writeText(text).then(() => alert('已复制！')).catch(() => alert('长按输出框手动复制'));
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('detailBox').innerHTML = '点击翻译后显示详情...';
  document.getElementById('bfOutput').value = '';
}

// Ctrl+Enter 快捷翻译
document.getElementById('inputText').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') translate();
});
</script>
</body>
</html>
