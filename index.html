<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF语言翻译器 Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.container { max-width: 500px; margin: 0 auto; }
h1 {
  color: #00d4ff;
  text-align: center;
  margin-bottom: 20px;
  font-size: 22px;
}
.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
label { color: #aaa; font-size: 14px; }
#charCount { color: #00d4ff; font-size: 12px; }
textarea {
  width: 100%;
  background: #0f0f1a;
  border: 2px solid #4a4a6a;
  border-radius: 10px;
  padding: 15px;
  color: #fff;
  font-size: 16px;
  resize: none;
  margin-bottom: 15px;
}
#inputText { height: 100px; }
#bfOutput { height: 120px; color: #00ff88; border-color: #00d4ff; }
#englishPreview {
  height: 50px;
  color: #ffcc00;
  border-color: #ffcc00;
  font-size: 14px;
}
.buttons { display: flex; gap: 10px; }
button {
  flex: 1;
  background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
  border: 2px solid #4a4a6a;
  color: #fff;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.1s;
}
button:active { transform: scale(0.95); }
#translateBtn {
  background: linear-gradient(145deg, #00d4ff, #0099cc);
  color: #000;
  font-weight: bold;
}
#copyBtn {
  background: linear-gradient(145deg, #00ff88, #00cc6a);
  color: #000;
}
#clearBtn {
  background: linear-gradient(145deg, #ff4757, #cc3344);
}
.mode-switch {
  text-align: center;
  margin-bottom: 15px;
  font-size: 14px;
  color: #888;
}
.mode-switch span { color: #00d4ff; font-weight: bold; }
.status {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-top: 10px;
  height: 20px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 BF语言翻译器 Pro</h1>
  <div class="mode-switch">中文 → English → <span>Beepspeak</span></div>
  
  <div class="label-row">
    <label>输入中文：</label>
    <span id="charCount">0 字</span>
  </div>
  <textarea id="inputText" placeholder="输入中文，比如：今天心情很好！"></textarea>
  
  <label>英文预览：</label>
  <textarea id="englishPreview" readonly></textarea>
  
  <label>BF语言输出：</label>
  <textarea id="bfOutput" readonly placeholder="翻译结果会显示在这里..."></textarea>
  
  <div class="buttons">
    <button id="translateBtn" onclick="translateToBF()">🔄 翻译</button>
    <button id="copyBtn" onclick="copyText()">📋 复制</button>
    <button id="clearBtn" onclick="clearAll()">清空</button>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
// BF核心词汇表
const bfWords = {
  'yes': 'beep', 'yeah': 'beep', 'ok': 'beep', 'okay': 'beep', 'good': 'beep boop', 'great': 'beep beep', 'nice': 'boop beep',
  'love': 'skdoo bep', 'like': 'beep bap', 'happy': 'boop beep bap', 'cool': 'skdoo',
  'no': 'boop', 'not': 'bap', "n't": 'bap', 'bad': 'boop bap', 'sad': 'bap boop', 'hate': 'bap bap',
  'angry': 'skdoo bap', 'wrong': 'bap beep', 'stop': 'bep bap',
  'what': 'boop beep', 'why': 'boop boop', 'how': 'beep boop beep', 'where': 'boop bap',
  'who': 'bap boop beep', 'when': 'boop beep bap', '?': '?', '!': '!',
  'i': 'beep', 'you': 'boop', 'he': 'bap', 'she': 'bap', 'it': 'beep bap',
  'me': 'beep', 'my': 'beep', 'your': 'boop', 'we': 'beep boop beep', 'they': 'bap bap beep',
  'is': 'beep', 'are': 'boop', 'am': 'bap', 'was': 'beep boop', 'were': 'boop beep',
  'do': 'skdoo', 'did': 'skdoo beep', 'have': 'bep', 'has': 'bep beep', 'had': 'bep boop',
  'go': 'skdoo bep', 'went': 'skdoo bep beep', 'come': 'bep sky', 'want': 'beep sky',
  'ice': 'beep boop', 'cold': 'boop bap', 'freeze': 'skdoo bep',
  'hello': 'beep boop', 'hi': 'beep', 'bye': 'boop bep', 'thanks': 'skdoo bep', 'sorry': 'boop bap'
};

// 音节划分（查词典API获取）
async function getSyllables(word) {
  try {
    const res = await fetch(`https://api.freecoltdictionary.com/${word}`);
    const data = await res.json();
    if (data && data.length > 0 && data[0].phonetics) {
      const phonetic = data.find(d => d.phonetics.some(p => p.text))?.phonetics.find(p => p.text)?.text;
      if (phonetic) {
        const syms = phonetic.match(/[aɪɛɔʊəː]/gi);
        if (syms && syms.length > 0) return syms.length;
      }
    }
  } catch (e) {}
  return Math.ceil(word.length / 2);
}

async function syllablize(word) {
  const num = await getSyllables(word);
  const map = ['', 'beep', 'beep boop', 'beep boop bap', 'skdoo bep beep', 'skdoo bep boop bap'];
  return map[Math.min(num, 5)] || 'skdoo bep boop bap';
}

async function englishToBF(text) {
  const words = text.toLowerCase().split(/(\s+|[.,!?;:')-])/);
  let result = [];
  for (let word of words) {
    if (/^\s+$/.test(word) || /^[.,!?;:')-]+$/.test(word)) {
      if (word === '?') result.push('?');
      else if (word === '!') result.push('!');
      else result.push(word);
      continue;
    }
    const cleanWord = word.replace(/[^a-z]/g, '');
    if (!cleanWord) continue;
    if (bfWords[cleanWord]) {
      result.push(bfWords[cleanWord]);
    } else {
      result.push(await syllablize(cleanWord));
    }
  }
  return result.join(' ').replace(/\s+/g, ' ').trim();
}

async function translateToBF() {
  const chineseText = document.getElementById('inputText').value.trim();
  const outputBox = document.getElementById('bfOutput');
  const enBox = document.getElementById('englishPreview');
  const statusEl = document.getElementById('status');
  if (!chineseText) {
    outputBox.value = '⚠️ 先输入中文再点翻译吧～';
    return;
  }
  outputBox.value = '🔄 翻译中...';
  enBox.value = '';
  statusEl.textContent = '📡 正在查词典，请稍候...';
  try {
    const translateRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chineseText)}&langpair=zh|en`);
    const translateData = await translateRes.json();
    const englishText = translateData.responseData.translatedText;
    enBox.value = englishText;
    const bfText = await englishToBF(englishText);
    outputBox.value = bfText;
    statusEl.textContent = '✅ 翻译完成！';
  } catch (error) {
    outputBox.value = '❌ 翻译出错了，检查网络再试试';
    statusEl.textContent = '';
  }
}

function copyText() {
  const text = document.getElementById('bfOutput').value;
  if (!text || text.includes('翻译中') || text.includes('⚠️') || text.includes('❌')) {
    alert('没有什么可复制的哦～');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制！去群里发 BF 语吧 🎵');
  }).catch(() => {
    alert('复制失败，长按输出框手动复制吧');
  });
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('englishPreview').value = '';
  document.getElementById('bfOutput').value = '';
  document.getElementById('status').textContent = '';
}

document.getElementById('inputText').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length + ' 字';
});
document.getElementById('inputText').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') translateToBF();
});
</script>
</body>
</html>
