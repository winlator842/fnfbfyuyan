<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF语言翻译器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.container { max-width: 500px; margin: 0 auto; }
h1 {
  color: #00d4ff;
  text-align: center;
  margin-bottom: 20px;
  font-size: 22px;
}
label { color: #aaa; font-size: 14px; display: block; margin-bottom: 8px; }
textarea {
  width: 100%;
  background: #0f0f1a;
  border: 2px solid #4a4a6a;
  border-radius: 10px;
  padding: 15px;
  color: #fff;
  font-size: 16px;
  resize: none;
  margin-bottom: 15px;
}
#inputText { height: 100px; }
#bfOutput { height: 120px; color: #00ff88; border-color: #00d4ff; }
.buttons { display: flex; gap: 10px; }
button {
  flex: 1;
  background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
  border: 2px solid #4a4a6a;
  color: #fff;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.1s;
}
button:active { transform: scale(0.95); }
#translateBtn {
  background: linear-gradient(145deg, #00d4ff, #0099cc);
  color: #000;
  font-weight: bold;
}
#copyBtn {
  background: linear-gradient(145deg, #00ff88, #00cc6a);
  color: #000;
}
#clearBtn {
  background: linear-gradient(145deg, #ff4757, #cc3344);
}
.mode-switch {
  text-align: center;
  margin-bottom: 15px;
  font-size: 14px;
  color: #888;
}
.mode-switch span {
  color: #00d4ff;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 BF语言翻译器</h1>
  <div class="mode-switch">中文 → English → <span>Beepspeak</span></div>
  
  <label>输入中文：</label>
  <textarea id="inputText" placeholder="比如：你好，今天心情怎么样？"></textarea>
  
  <label>BF语言输出：</label>
  <textarea id="bfOutput" readonly placeholder="翻译结果会显示在这里..."></textarea>
  
  <div class="buttons">
    <button id="translateBtn" onclick="translateToBF()">🔄 翻译</button>
    <button id="copyBtn" onclick="copyText()">📋 复制</button>
    <button id="clearBtn" onclick="clearAll()">清空</button>
  </div>
</div>
<script>
// BF词汇表
const bfWords = {
  // 肯定/积极
  'yes': 'beep', 'yeah': 'beep', 'ok': 'beep', 'okay': 'beep', 'good': 'beep boop', 'great': 'beep beep', 'nice': 'boop beep',
  'love': 'skdoo bep', 'like': 'beep bap', 'happy': 'boop beep bap', 'cool': 'skdoo',
  // 否定/消极
  'no': 'boop', 'not': 'bap', "n't": 'bap', 'bad': 'boop bap', 'sad': 'bap boop', 'hate': 'bap bap',
  'angry': 'skdoo bap', 'wrong': 'bap beep', 'stop': 'bep bap',
  // 疑问
  'what': 'boop beep', 'why': 'boop boop', 'how': 'beep boop beep', 'where': 'boop bap',
  'who': 'bap boop beep', 'when': 'boop beep bap', '?': '?',
  // 人称
  'i': 'beep', 'you': 'boop', 'he': 'bap', 'she': 'bap', 'it': 'beep bap',
  'me': 'beep', 'my': 'beep', 'your': 'boop', 'we': 'beep boop beep', 'they': 'bap bap beep',
  // 动词
  'is': 'beep', 'are': 'boop', 'am': 'bap', 'was': 'beep boop', 'were': 'boop beep',
  'do': 'skdoo', 'did': 'skdoo beep', 'have': 'bep', 'has': 'bep beep', 'had': 'bep boop',
  'go': 'skdoo bep', 'went': 'skdoo bep beep', 'come': 'bep sky', 'want': 'beep sky',
  'say': 'boop sky', 'tell': 'bap sky', 'know': 'beep know', 'think': 'boop think',
  'see': 'skdoo see', 'look': 'bap look', 'play': 'skdoo play', 'eat': 'beep eat',
  'make': 'boop make', 'get': 'bep get', 'give': 'skdoo give', 'take': 'bap take',
  // 常用词
  'the': 'be', 'a': 'b', 'an': 'b', 'this': 'beep boop', 'that': 'boop beep',
  'here': 'bep here', 'there': 'bop there', 'now': 'beep now', 'then': 'boop then',
  'and': '+', 'or': 'bap', 'but': 'skdoo', 'because': 'beep cause', 'so': 'bep so',
  'if': 'beep if', 'when': 'boop when', 'time': 'bep time', 'day': 'beep day',
  'today': 'beep day', 'hello': 'beep boop', 'hi': 'beep', 'bye': 'boop bep',
  'thanks': 'skdoo bep', 'sorry': 'boop bap', 'please': 'beep please',
  'friend': 'beep friend', 'people': 'bop people', 'thing': 'bep thing',
  // 感叹/语气
  '!': '!', 'wow': 'skdoo bep!', 'oh': 'boop!', 'ah': 'beep!',
  'really': 'beep really', 'very': 'bep very', 'so': 'bep so', 'too': 'boop too'
};

// 音节化函数：把英文拆成 beep/boop 音节
function syllablize(word) {
  if (word.length === 0) return '';
  if (word.length <= 3) return Math.random() > 0.5 ? 'beep' : 'boop';
  if (word.length <= 5) return 'beep boop';
  if (word.length <= 7) return 'beep boop bap';
  return 'skdoo bep ' + (Math.random() > 0.5 ? 'beep' : 'boop');
}

// 英文转BF语言
function englishToBF(text) {
  const words = text.toLowerCase().split(/(\s+|[.,!?;:])/);
  let result = [];
  
  for (let word of words) {
    if (/^\s+$/.test(word) || /^[.,!?;:]+$/.test(word)) {
      if (word === '?') result.push('?');
      else if (word === '!') result.push('!');
      else if (word === '.') result.push('bap');
      else result.push(word);
      continue;
    }
    
    // 查词汇表
    if (bfWords[word]) {
      result.push(bfWords[word]);
    } else if (word.length > 0) {
      // 不在词汇表里的词，音节化
      result.push(syllablize(word.replace(/[^a-z]/g, '')));
    }
  }
  
  return result.join(' ').replace(/\s+/g, ' ').trim();
}

// 主翻译函数（调用免费翻译API）
async function translateToBF() {
  const chineseText = document.getElementById('inputText').value.trim();
  const outputBox = document.getElementById('bfOutput');
  
  if (!chineseText) {
    outputBox.value = '⚠️ 先输入中文再点翻译吧～';
    return;
  }
  
  outputBox.value = '🔄 翻译中...';
  
  try {
    // 调用免费翻译API（中文→英文）
    const translateRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chineseText)}&langpair=zh|en`);
    const translateData = await translateRes.json();
    const englishText = translateData.responseData.translatedText;
    
    console.log('中文:', chineseText);
    console.log('英文:', englishText);
    
    // 英文转BF语言
    const bfText = englishToBF(englishText);
    outputBox.value = bfText;
    
  } catch (error) {
    console.error(error);
    outputBox.value = '❌ 翻译出错了，检查一下网络连接再试试';
  }
}

function copyText() {
  const text = document.getElementById('bfOutput').value;
  if (!text || text.startsWith('⚠️') || text.startsWith('❌') || text.includes('翻译中')) {
    alert('没有什么可复制的哦～');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制！去群里发 BF 语吧 🎵');
  }).catch(() => {
    alert('复制失败，长按输出框手动复制吧');
  });
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('bfOutput').value = '';
}

// 回车翻译（Ctrl+Enter）
document.getElementById('inputText').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    translateToBF();
  }
});
</script>
</body>
</html>
